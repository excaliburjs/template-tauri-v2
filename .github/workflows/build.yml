name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
    - run: npm ci
    # Type-check before the expensive browser install: this gate is what catches
    # v1 API removals and options-bag typos (e.g. moveBy durationMs) that the
    # bundler would otherwise transpile away silently.
    - name: Type check
      run: npm run typecheck
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # NOTE: `npm test` builds the frontend and runs the Playwright suite against `vite preview`.
    # That covers the WEB LAYER ONLY - the same index.html + src/ that Tauri loads into its
    # webview. It does NOT build or exercise the Tauri desktop app: no Rust toolchain is
    # installed here, `cargo`/`tauri build` never runs, and Playwright has no driver for a
    # Tauri v2 (WebKitGTK/WRY) window. Testing the real window would need `tauri-driver` +
    # WebdriverIO on a separate job with a Rust toolchain and the system webkit2gtk deps.
    - run: npm test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
